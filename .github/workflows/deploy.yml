name: Reviewed Terraform deployment
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [default, dev, staging, prod]
        default: default
        required: true
permissions:
  contents: read
concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false
env:
  TF_IN_AUTOMATION: 'true'
  TARGET_ENV: ${{ inputs.environment }}
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: ${{ inputs.environment }}-plan
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Check account settings
        env:
          PLAN_PASSPHRASE: ${{ secrets.TF_PLAN_PASSPHRASE }}
          DEPLOYMENT_ENABLED: ${{ vars.DEPLOYMENT_ENABLED }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
          TF_LOCK_MODE: ${{ vars.TF_LOCK_MODE }}
          TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
          TF_VAR_ami_id: ${{ vars.AWS_AMI_ID }}
          TF_VAR_allow_latest_ami: 'false'
        run: |
          test "$DEPLOYMENT_ENABLED" = true
          test -n "$TF_VAR_ami_id"
          test -n "$PLAN_PASSPHRASE"
          for key in AWS_REGION TF_STATE_BUCKET TF_STATE_KEY TF_LOCK_MODE TF_VAR_ami_id TF_VAR_allow_latest_ami TF_LOCK_TABLE; do
            value="${!key}"
            [[ "$value" != *$'\n'* && "$value" != *$'\r'* ]]
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: bash scripts/init_backend.sh
      # Fail if the workspace does not exist; never silently create another stack.
      - run: terraform workspace select "$TARGET_ENV"
      - run: terraform plan -input=false -lock-timeout=5m -var-file="environments/$TARGET_ENV.tfvars" -out=reviewed.tfplan
      - name: Reject destructive changes
        run: |
          terraform show -json reviewed.tfplan > reviewed.plan.json
          python3 scripts/check_plan.py reviewed.plan.json
      - name: Encrypt the exact plan for review and apply
        env:
          PLAN_PASSPHRASE: ${{ secrets.TF_PLAN_PASSPHRASE }}
        run: |
          printf '%s' "$PLAN_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output reviewed.tfplan.gpg reviewed.tfplan
          rm reviewed.tfplan reviewed.plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-plan
          path: reviewed.tfplan.gpg
          retention-days: 1
      - name: Review instructions
        run: echo 'Download and decrypt the plan; inspect it with terraform show before approving the apply environment.' >> "$GITHUB_STEP_SUMMARY"
  apply:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Check account settings
        env:
          DEPLOYMENT_ENABLED: ${{ vars.DEPLOYMENT_ENABLED }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
          TF_LOCK_MODE: ${{ vars.TF_LOCK_MODE }}
          TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
          TF_VAR_ami_id: ${{ vars.AWS_AMI_ID }}
          TF_VAR_allow_latest_ami: 'false'
          PLAN_PASSPHRASE: ${{ secrets.TF_PLAN_PASSPHRASE }}
        run: |
          test "$DEPLOYMENT_ENABLED" = true
          test -n "$TF_VAR_ami_id"
          test -n "$PLAN_PASSPHRASE"
          for key in AWS_REGION TF_STATE_BUCKET TF_STATE_KEY TF_LOCK_MODE TF_VAR_ami_id TF_VAR_allow_latest_ami TF_LOCK_TABLE; do
            value="${!key}"
            [[ "$value" != *$'\n'* && "$value" != *$'\r'* ]]
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: bash scripts/init_backend.sh
      - run: terraform workspace select "$TARGET_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-plan
      - name: Decrypt and apply the reviewed plan
        env:
          PLAN_PASSPHRASE: ${{ secrets.TF_PLAN_PASSPHRASE }}
        run: |
          printf '%s' "$PLAN_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt --output reviewed.tfplan reviewed.tfplan.gpg
          terraform show -json reviewed.tfplan > reviewed.plan.json
          python3 scripts/check_plan.py reviewed.plan.json
          terraform apply -input=false -lock-timeout=5m reviewed.tfplan
